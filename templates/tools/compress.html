{% extends "base.html" %}
{% block title %}Compress PDF - PDF to Anything{% endblock %}
{% block content %}
<div class="container tool-page"><section class="hero"><div class="hero-content">
    <h1>Compress a PDF</h1><p>Rewrite a PDF into a clean, compact copy for sharing.</p>
</div></section><section class="upload-section">
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".pdf,application/pdf" required>
        <button class="btn btn-primary" type="submit">Compress PDF</button>
    </form>
</section></div>
{% endblock %}
