<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF to Anything{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="app">
        <!-- Inline Notifications -->
        <div id="notifications" class="notifications-container"></div>
        
        <!-- Navigation -->
        <nav class="navbar">
            <div class="navbar-container">
                <div class="navbar-brand">
                    <a href="/">PDF to Anything</a>
                </div>
                <div class="navbar-menu">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/tools/merge" class="nav-link">Tools</a>
                    <a href="/faq" class="nav-link">FAQ</a>
                    <a href="/privacy" class="nav-link">Privacy</a>
                </div>
            </div>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
        
        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 PDF to Anything. All files are temporarily stored and automatically deleted.</p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% if pwa_enabled %}
    <script src="{{ url_for('static', filename='js/service-worker-register.js') }}"></script>
    {% endif %}
    {% block extra_js %}{% endblock %}
</body>
</html>
